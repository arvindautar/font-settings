<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Rendering: mirror GNOME's settings (gsettings org.gnome.desktop.interface)
    so non-GTK apps (Qt, Chromium/Electron, Flatpaks) render text the same way.
    Panel: built-in eDP-1, 1920x1200, RGB subpixel order.
  -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint"  mode="assign"><bool>false</bool></edit>
    <edit name="rgba"      mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Generic families: match the GNOME UI fonts instead of falling to Noto -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
  <!-- Flatpak runtimes default serif to DejaVu Serif; keep it on Noto Serif like the host -->
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
</fontconfig>
